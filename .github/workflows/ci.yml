name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias (lockfile estricto, sin scripts de instalación)
        run: npm ci

      - name: Auditoría de vulnerabilidades (producción, bloqueante)
        run: npm run audit

      - name: Auditoría de herramientas de desarrollo (informativa)
        run: npm run audit:dev

      - name: Sin ejecutables en dependencias
        run: npm run check:exe

      - name: Formato
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Pruebas
        run: npm test

      - name: Compilar web
        run: npm run build
